<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportsX | India's Sports Network</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .pb-safe { padding-bottom: 90px; }
        .gradient-text { background: linear-gradient(135deg, #2563eb, #14b8a6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        html.dark body { background-color: #111827; }
        html.dark .app-bg { background-color: #1f2937; color: #f9fafb; }
        html.dark .card-bg { background-color: #374151; color: #f9fafb; border-color: #4b5563; }
        html.dark .text-muted { color: #9ca3af; }
        html.dark input, html.dark select, html.dark textarea { background-color: #1f2937 !important; color: white !important; border-color: #4b5563 !important; }
        .hidden { display: none !important; }
    </style>
</head>
<body class="h-screen w-full flex justify-center overflow-hidden bg-gray-900 transition-colors">

    <div class="w-full max-w-md h-full bg-white app-bg relative overflow-hidden flex flex-col shadow-2xl transition-colors">
        
        <div id="login-screen" class="absolute inset-0 bg-white app-bg z-50 flex flex-col justify-center items-center p-6 text-center">
            <div class="mb-10 w-full">
                <i class="fa-solid fa-trophy text-6xl text-blue-600 mb-4 drop-shadow-sm"></i>
                <h1 class="text-4xl font-black gradient-text tracking-right mb-2">SportsX</h1>
                <p class="text-gray-500 text-muted font-medium">Discover, Connect & Compete.</p>
            </div>
            <div class="w-full space-y-4">
                <button onclick="login()" class="w-full bg-white card-bg border border-gray-300 font-bold py-3.5 rounded-xl shadow-sm flex items-center justify-center space-x-3 transition-colors">
                    <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5" alt="Google">
                    <span id="btn-text">Sign in with Google</span>
                </button>
            </div>
        </div>

        <header class="px-4 py-3 flex justify-between items-center border-b border-gray-200 card-bg z-10 transition-colors">
            <h1 class="text-xl font-black">SportsX</h1>
            <div class="flex items-center space-x-2">
                <button onclick="toggleDarkMode()" class="w-9 h-9 rounded-full bg-gray-100 card-bg flex items-center justify-center text-gray-700 dark:text-yellow-400 transition">
                    <i id="theme-icon" class="fa-solid fa-moon"></i>
                </button>
                <button onclick="openPostModal()" class="bg-purple-600 hover:bg-purple-700 text-white font-bold px-4 py-2 rounded-xl text-sm flex items-center space-x-1.5 shadow-md transition-colors">
                    <i class="fa-solid fa-plus"></i><span>Post</span>
                </button>
            </div>
        </header>
                <div class="flex-1 overflow-y-auto pb-safe">
            
            <div id="feed-view" class="p-4 space-y-4">
                <div class="relative">
                    <i class="fa-solid fa-search absolute left-3 top-3.5 text-gray-400 text-sm"></i>
                    <input type="text" id="search-input" oninput="filterEvents()" placeholder="Search by location (e.g. Tamil Nadu, Kerala) or sport" class="w-full pl-9 pr-4 py-3 bg-white card-bg border border-gray-200 rounded-2xl text-sm outline-none transition-colors">
                </div>
                
                <div id="user-welcome" class="text-xs font-bold uppercase tracking-wider text-black dark:text-white text-center mt-4 mb-2"></div>
                
                <div id="events-feed" class="space-y-4"></div>
            </div>

            <div id="account-view" class="p-4 space-y-4 hidden">
                <div class="bg-white card-bg p-6 rounded-3xl border border-gray-200 text-center shadow-sm">
                    <div id="profile-avatar-container" class="w-20 h-20 bg-blue-600 text-white rounded-full flex items-center justify-center text-3xl font-black mx-auto mb-3 overflow-hidden shadow-inner">
                        <span id="profile-initial">U</span>
                    </div>
                    <h2 id="profile-name" class="text-lg font-bold">User Name</h2>
                    <p id="profile-email" class="text-xs text-gray-500 text-muted mb-4">email@example.com</p>
                    
                    <button onclick="logout()" class="w-full bg-red-50 dark:bg-red-900 dark:bg-opacity-20 text-red-600 dark:text-red-400 font-bold py-3.5 rounded-2xl text-sm border border-red-200 dark:border-red-800 transition">
                        <i class="fa-solid fa-right-from-bracket mr-2"></i> Log Out
                    </button>
                </div>
            </div>

        </div>

        <nav class="absolute bottom-0 left-0 right-0 h-16 bg-white card-bg border-t border-gray-200 flex justify-around items-center px-6 z-30 transition-colors">
            <button onclick="switchTab('feed')" id="nav-feed" class="flex flex-col items-center text-blue-600 dark:text-blue-400">
                <i class="fa-solid fa-house text-lg mb-1"></i>
                <span class="text-[10px] font-bold">Feed</span>
            </button>
            <button onclick="switchTab('account')" id="nav-account" class="flex flex-col items-center text-gray-400 hover:text-gray-600">
                <i class="fa-solid fa-user-gear text-lg mb-1"></i>
                <span class="text-[10px] font-bold">Account Centre</span>
            </button>
        </nav>

        <div id="post-modal" class="absolute inset-0 bg-black bg-opacity-50 z-50 hidden flex flex-col justify-end backdrop-blur-sm overflow-y-auto">
            <div class="bg-white card-bg p-6 rounded-t-3xl space-y-4 max-h-[90vh] overflow-y-auto border-t border-gray-200">
                <div class="flex justify-between items-center border-b border-gray-200 card-bg pb-3">
                    <h2 class="text-xl font-black">Post Tournament / Event</h2>
                    <button onclick="closePostModal()" class="w-8 h-8 rounded-full bg-gray-100 card-bg flex items-center justify-center text-gray-500">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
                
                <div>
                    <label class="text-xs font-bold uppercase text-gray-500 text-muted mb-1 block">Event Title</label>
                    <input type="text" id="event-title" placeholder="e.g., Tech Corporate Cup" class="w-full border border-gray-300 p-3 rounded-xl text-sm outline-none">
                </div>

                <div>
                    <label class="text-xs font-bold uppercase text-gray-500 text-muted mb-1 block">Organizer Type</label>
                    <select id="organizer-type" class="w-full border border-gray-300 p-3 rounded-xl text-sm outline-none">
                        <option value="🏢 Corporate / Company">🏢 Corporate / Company</option>
                        <option value="🎓 College / University">🎓 College / University</option>
                        <option value="🏆 Sports Academy">🏆 Sports Academy</option>
                        <option value="⭐ Independent Organizer">⭐ Independent Organizer</option>
                    </select>
                </div>

                <div>
                    <label class="text-xs font-bold uppercase text-gray-500 text-muted mb-1 block">Sport / Category</label>
                    <select id="event-sport" onchange="checkCustomSport(this)" class="w-full border border-gray-300 p-3 rounded-xl text-sm outline-none">
                        <option value="Cricket">Cricket</option>
                        <option value="Football">Football</option>
                        <option value="Kabaddi">Kabaddi</option>
                        <option value="Badminton">Badminton</option>
                        <option value="Basketball">Basketball</option>
                        <option value="Hockey">Hockey</option>
                        <option value="Volleyball">Volleyball</option>
                        <option value="Table Tennis">Table Tennis</option>
                        <option value="Tennis">Tennis</option>
                        <option value="Athletics / Running">Athletics / Running</option>
                        <option value="Chess">Chess</option>
                        <option value="Other">Other (Custom Sport)</option>
                    </select>
                </div>

                <div id="custom-sport-box" class="hidden">
                    <label class="text-xs font-bold uppercase text-gray-500 text-muted mb-1 block">Specify Sport</label>
                    <input type="text" id="custom-sport-input" placeholder="e.g., Swimming" class="w-full border border-gray-300 p-3 rounded-xl text-sm outline-none">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-xs font-bold uppercase text-gray-500 text-muted mb-1 block">Start Date</label>
                        <input type="date" id="event-date" class="w-full border border-gray-300 p-3 rounded-xl text-sm outline-none">
                    </div>
                    <div>
                        <label class="text-xs font-bold uppercase text-gray-500 text-muted mb-1 block">End Date (Optional)</label>
                        <input type="date" id="event-end-date" class="w-full border border-gray-300 p-3 rounded-xl text-sm outline-none">
                    </div>
                </div>

                <div>
                    <label class="text-xs font-bold uppercase text-gray-500 text-muted mb-1 block">Time</label>
                    <input type="text" id="event-time" placeholder="e.g., 9:00 AM to 5:00 PM" class="w-full border border-gray-300 p-3 rounded-xl text-sm outline-none">
                </div>

                <div>
                    <label class="text-xs font-bold uppercase text-gray-500 text-muted mb-1 block">Location / Venue</label>
                    <input type="text" id="event-location" placeholder="e.g., Kongu Engineering College, Erode" class="w-full border border-gray-300 p-3 rounded-xl text-sm outline-none">
                </div>

                <div>
                    <label class="text-xs font-bold uppercase text-gray-500 text-muted mb-1 block">Image URL (Optional)</label>
                    <input type="url" id="event-image" placeholder="https://images.unsplash.com/..." class="w-full border border-gray-300 p-3 rounded-xl text-sm outline-none">
                </div>

                <div>
                    <label class="text-xs font-bold uppercase text-gray-500 text-muted mb-1 block">Registration Link / URL</label>
                    <input type="url" id="event-link" placeholder="https://forms.gle/..." class="w-full border border-gray-300 p-3 rounded-xl text-sm outline-none">
                </div>

                <button onclick="submitRealEvent()" id="submit-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl shadow-md transition">Publish Event</button>
            </div>
        </div>

    </div>
        <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDw7zgeMaMKfEokVNGjEaZzh3ByL2F7Jrg",
            authDomain: "sportsx-8f949.firebaseapp.com",
            projectId: "sportsx-8f949",
            storageBucket: "sportsx-8f949.firebasestorage.app",
            messagingSenderId: "197558739956",
            appId: "1:197558739956:web:46e770009c4f9bc5144fa1",
            measurementId: "G-ZGBMHXHQYS"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();
        const db = getFirestore(app);

        let allEventsCache = [];

        window.switchTab = function(tab) {
            const feedView = document.getElementById('feed-view');
            const accountView = document.getElementById('account-view');
            const navFeed = document.getElementById('nav-feed');
            const navAccount = document.getElementById('nav-account');

            if (tab === 'feed') {
                feedView.classList.remove('hidden');
                accountView.classList.add('hidden');
                navFeed.className = "flex flex-col items-center text-blue-600 dark:text-blue-400";
                navAccount.className = "flex flex-col items-center text-gray-400 hover:text-gray-600";
            } else {
                feedView.classList.add('hidden');
                accountView.classList.remove('hidden');
                navFeed.className = "flex flex-col items-center text-gray-400 hover:text-gray-600";
                navAccount.className = "flex flex-col items-center text-blue-600 dark:text-blue-400";
            }
        };

        window.toggleDarkMode = function() {
            const html = document.documentElement;
            const icon = document.getElementById('theme-icon');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                icon.className = "fa-solid fa-moon";
            } else {
                html.classList.add('dark');
                icon.className = "fa-solid fa-sun";
            }
        };

        function handleUserLogin(user) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('user-welcome').innerText = "LOGGED IN AS: " + user.displayName.toUpperCase();
            document.getElementById('profile-name').innerText = user.displayName;
            document.getElementById('profile-email').innerText = user.email;
            
            const avatarContainer = document.getElementById('profile-avatar-container');
            if (user.photoURL) {
                avatarContainer.innerHTML = `<img src="${user.photoURL}" class="w-full h-full object-cover" alt="Profile">`;
            } else {
                document.getElementById('profile-initial').innerText = user.displayName.charAt(0).toUpperCase();
            }
            loadEvents();
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                handleUserLogin(user);
            } else {
                document.getElementById('login-screen').style.display = 'flex';
                document.getElementById('btn-text').innerText = 'Sign in with Google';
            }
        });

        window.login = function() {
            document.getElementById('btn-text').innerText = 'Connecting...';
            signInWithPopup(auth, provider).then((result) => {
                handleUserLogin(result.user);
            }).catch((error) => {
                console.warn("Login error code:", error.code);
                document.getElementById('btn-text').innerText = 'Sign in with Google';
                alert("Firebase Error [" + error.code + "]: " + error.message);
            });
        };

        window.logout = function() {
            signOut(auth).then(() => {
                window.location.reload();
            }).catch((error) => console.error(error));
        };

        window.openPostModal = function() {
            document.getElementById('post-modal').classList.remove('hidden');
        }

        window.closePostModal = function() {
            document.getElementById('post-modal').classList.add('hidden');
            document.getElementById('event-title').value = '';
            document.getElementById('event-date').value = '';
            document.getElementById('event-end-date').value = ''; 
            document.getElementById('event-time').value = '';
            document.getElementById('event-location').value = '';
            document.getElementById('event-image').value = '';
            document.getElementById('event-link').value = '';
            document.getElementById('custom-sport-box').classList.add('hidden');
            document.getElementById('event-sport').value = 'Cricket';
            document.getElementById('organizer-type').value = '🏢 Corporate / Company';
        }

        window.checkCustomSport = function(select) {
            const customBox = document.getElementById('custom-sport-box');
            if (select.value === 'Other') {
                customBox.classList.remove('hidden');
            } else {
                customBox.classList.add('hidden');
            }
        }

        window.submitRealEvent = async function() {
            const user = auth.currentUser;
            const title = document.getElementById('event-title').value;
            const organizerType = document.getElementById('organizer-type').value;
            let sport = document.getElementById('event-sport').value;
            
            if (sport === 'Other') {
                const customSport = document.getElementById('custom-sport-input').value.trim();
                if (!customSport) {
                    alert("Please specify your custom sport name.");
                    return;
                }
                sport = customSport;
            }

            const date = document.getElementById('event-date').value;
            const endDate = document.getElementById('event-end-date').value;
            const time = document.getElementById('event-time').value;
            const location = document.getElementById('event-location').value;
            const image = document.getElementById('event-image').value;
            const link = document.getElementById('event-link').value;
            const submitBtn = document.getElementById('submit-btn');

            if (!title.trim() || !date || !location) {
                alert("Please fill in the Event Title, Start Date, and Location.");
                return;
            }

            submitBtn.innerText = "Publishing...";

            try {
                await addDoc(collection(db, "events"), {
                    title,
                    sport,
                    organizerType,
                    date,
                    endDate: endDate || "", 
                    time: time || "TBD",
                    location,
                    image: image.trim() || "",
                    link: link || "#",
                    postedBy: user.displayName,
                    createdAt: new Date().getTime()
                });
                
                closePostModal();
                submitBtn.innerText = "Publish Event";
                loadEvents();
            } catch (error) {
                alert("Database error: " + error.message);
                submitBtn.innerText = "Publish Event";
            }
        };

        async function loadEvents() {
            const feed = document.getElementById('events-feed');
            feed.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-blue-600 text-2xl flex justify-center mt-10"></i>';
            
            try {
                const querySnapshot = await getDocs(collection(db, "events"));
                allEventsCache = [];
                
                querySnapshot.forEach((doc) => {
                    allEventsCache.push(doc.data());
                });

                window.filterEvents();
            } catch (error) {
                feed.innerHTML = '<p class="text-center text-red-500 text-sm mt-5">Failed to load events.</p>';
            }
        }

        window.filterEvents = function() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            const feed = document.getElementById('events-feed');
            feed.innerHTML = '';

            const filtered = allEventsCache.filter(ev => 
                ev.location.toLowerCase().includes(searchTerm) || 
                ev.title.toLowerCase().includes(searchTerm) ||
                ev.sport.toLowerCase().includes(searchTerm)
            );

            if (filtered.length === 0) {
                feed.innerHTML = '<p class="text-center text-gray-400 text-sm mt-10">No sports events found.</p>';
                return;
            }

            filtered.sort((a, b) => b.createdAt - a.createdAt);

            filtered.forEach(ev => {
                let imageHTML = '';
                if (ev.image && ev.image.startsWith("http")) {
                    imageHTML = `<div class="mb-3 -mx-4 -mt-4"><img src="${ev.image}" class="w-full h-48 object-cover rounded-t-2xl" alt="Event Image"></div>`;
                }

                const dateDisplay = ev.endDate ? `${ev.date} to ${ev.endDate}` : ev.date;

                feed.innerHTML += `
                    <div class="bg-white card-bg p-4 rounded-2xl shadow-sm border border-gray-100 space-y-3 transition-colors">
                        ${imageHTML}
                        <div class="flex items-center space-x-2">
                            <span class="bg-blue-100 text-blue-800 text-[10px] font-extrabold px-2.5 py-1 rounded-full uppercase">${ev.sport}</span>
                            <span class="text-[10px] text-gray-500 text-muted font-bold">${ev.organizerType}</span>
                        </div>
                        <h3 class="text-lg font-bold">${ev.title}</h3>
                        <p class="text-xs text-gray-500 text-muted font-medium flex items-center space-x-1">
                            <i class="fa-solid fa-user-shield mr-1"></i> Posted by ${ev.postedBy}
                        </p>
                        <div class="bg-gray-50 dark:bg-gray-800 p-3 rounded-xl space-y-1.5 text-xs">
                            <div class="flex items-center text-gray-600 dark:text-gray-300">
                                <i class="fa-regular fa-calendar text-blue-600 w-5"></i>
                                <span class="font-medium">${dateDisplay} at ${ev.time}</span>
                            </div>
                            <div class="flex items-center text-gray-600 dark:text-gray-300">
                                <i class="fa-solid fa-location-dot text-red-500 w-5"></i>
                                <span class="font-medium">${ev.location}</span>
                            </div>
                        </div>
                        <a href="${ev.link}" target="_blank" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-xl text-xs flex items-center justify-center space-x-2 shadow-sm transition">
                            <span>Register / Event Link</span>
                            <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                        </a>
                    </div>
                `;
            });
        };
    </script>
</body>
</html>
