<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2563eb">
    <meta name="description" content="SportsX - discover, post and join sports events and tournaments across India.">
    <title>SportsX | India's Sports Network</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%86%3C/text%3E%3C/svg%3E">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Apply saved / system theme before first paint (prevents a light flash) -->
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('sportsx-theme');
                var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (dark) document.documentElement.classList.add('dark');
            } catch (e) { /* storage blocked - stay in light mode */ }
        })();
    </script>

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        html.dark { color-scheme: dark; }

        /* Full-height layout that respects mobile browser toolbars */
        .app-h { height: 100vh; height: 100dvh; }

        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .pb-safe { padding-bottom: calc(90px + env(safe-area-inset-bottom, 0px)); }
        .nav-bar { height: calc(4rem + env(safe-area-inset-bottom, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px); }

        .gradient-text { background: linear-gradient(90deg, #2563eb, #14b8a6); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }

        /* Helpers Tailwind 2's prebuilt CSS doesn't ship */
        .text-2xs { font-size: 10px; line-height: 1rem; }
        .text-muted { color: #6b7280; }
        .subtle-bg { background-color: #f9fafb; }
        .divider { border-color: #f3f4f6; }
        .event-card { transition: transform 0.15s ease; }
        .event-card:hover { transform: scale(1.01); }

        /* Dark mode (Tailwind 2's prebuilt CSS has no dark: variants) */
        html.dark body { background-color: #111827; }
        html.dark .app-bg { background-color: #1f2937; color: #f9fafb; }
        html.dark .card-bg { background-color: #374151; color: #f9fafb; border-color: #4b5563; }
        html.dark .text-muted { color: #9ca3af; }
        html.dark .subtle-bg { background-color: rgba(55, 65, 81, 0.5); }
        html.dark .divider { border-color: #374151; }
        html.dark .btn-secondary { background-color: #4b5563; color: #f9fafb; }
        html.dark .badge-org { background-color: #4b5563; color: #d1d5db; }
        html.dark .badge-sport { background-color: #1e3a8a; color: #bfdbfe; }
        html.dark .status-ok { color: #4ade80; }
        html.dark .btn-danger { background-color: rgba(127, 29, 29, 0.3); color: #f87171; }
        html.dark input, html.dark select, html.dark textarea { background-color: #4b5563 !important; color: white !important; border-color: #6b7280 !important; }
        html.dark input::placeholder { color: #9ca3af; }

        button:disabled { opacity: 0.6; cursor: not-allowed; }

        /* Ensures the hidden class always wins over flex/block utilities */
        .hidden { display: none !important; }
    </style>
</head>
<body class="app-h w-full flex justify-center overflow-hidden bg-gray-900 transition-colors">
    <noscript>SportsX needs JavaScript enabled to work.</noscript>

    <div class="w-full max-w-md h-full bg-gray-50 app-bg relative overflow-hidden flex flex-col shadow-2xl transition-colors duration-300">

        <!-- LOGIN SCREEN -->
        <div id="login-screen" class="absolute inset-0 bg-white app-bg z-50 flex flex-col justify-center items-center px-6">
            <div class="text-center mb-10 w-full">
                <i class="fa-solid fa-trophy text-6xl text-blue-600 mb-4" aria-hidden="true"></i>
                <h1 class="text-4xl font-black gradient-text tracking-tight mb-2">SportsX</h1>
                <p class="text-muted font-medium">Discover, Connect &amp; Compete.</p>
            </div>
            <div class="w-full space-y-4">
                <button id="login-btn" type="button" onclick="login()" class="w-full bg-white card-bg border border-gray-300 text-gray-700 font-bold py-3.5 rounded-xl shadow-sm flex items-center justify-center space-x-3 transition">
                    <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5" alt="" aria-hidden="true">
                    <span id="btn-text">Sign in with Google</span>
                </button>
            </div>
        </div>

        <!-- CREATE EVENT POPUP FORM -->
        <div id="post-modal" role="dialog" aria-modal="true" aria-labelledby="post-modal-title" class="hidden absolute inset-0 bg-gray-900 bg-opacity-60 z-50 flex px-4 py-8 backdrop-filter backdrop-blur-sm overflow-y-auto">
            <div class="bg-white card-bg w-full m-auto p-6 rounded-2xl shadow-xl">
                <h2 id="post-modal-title" class="text-2xl font-black mb-4">Post Tournament / Event</h2>

                <label for="event-title" class="block text-xs font-bold uppercase text-muted mb-1">Event Title</label>
                <input type="text" id="event-title" maxlength="120" placeholder="e.g., Tech Corporate Cup" class="w-full border border-gray-300 p-3 rounded-xl mb-3 outline-none text-sm">

                <label for="organizer-type" class="block text-xs font-bold uppercase text-muted mb-1">Organizer Type</label>
                <select id="organizer-type" class="w-full border border-gray-300 p-3 rounded-xl mb-3 outline-none text-sm">
                    <option value="🏢 Corporate / Company">🏢 Corporate / Company</option>
                    <option value="🎓 College / University">🎓 College / University</option>
                    <option value="🏆 Sports Academy">🏆 Sports Academy</option>
                    <option value="👤 Independent Organizer">👤 Independent Organizer</option>
                </select>

                <label for="event-sport" class="block text-xs font-bold uppercase text-muted mb-1">Sport / Category</label>
                <select id="event-sport" onchange="checkCustomSport(this)" class="w-full border border-gray-300 p-3 rounded-xl mb-3 outline-none text-sm">
                    <option value="Cricket">Cricket</option>
                    <option value="Football">Football</option>
                    <option value="Kabaddi">Kabaddi</option>
                    <option value="Badminton">Badminton</option>
                    <option value="Basketball">Basketball</option>
                    <option value="Hockey">Hockey</option>
                    <option value="Volleyball">Volleyball</option>
                    <option value="Table Tennis">Table Tennis</option>
                    <option value="Tennis">Tennis</option>
                    <option value="Athletics / Running">Athletics / Running</option>
                    <option value="Chess">Chess</option>
                    <option value="Esports / Gaming">Esports / Gaming</option>
                    <option value="Other">Other (Type custom)...</option>
                </select>

                <div id="custom-sport-box" class="hidden mb-3">
                    <label for="custom-sport-input" class="block text-xs font-bold uppercase text-muted mb-1">Specify Sport</label>
                    <input type="text" id="custom-sport-input" maxlength="60" placeholder="e.g., Swimming" class="w-full border border-gray-300 p-3 rounded-xl outline-none text-sm">
                </div>

                <div class="flex space-x-2 mb-3">
                    <div class="flex-1 min-w-0">
                        <label for="event-date" class="block text-xs font-bold uppercase text-muted mb-1">Start Date</label>
                        <input type="date" id="event-date" class="w-full border border-gray-300 p-3 rounded-xl outline-none text-sm">
                    </div>
                    <div class="flex-1 min-w-0">
                        <label for="event-end-date" class="block text-xs font-bold uppercase text-muted mb-1">End Date</label>
                        <input type="date" id="event-end-date" class="w-full border border-gray-300 p-3 rounded-xl outline-none text-sm">
                    </div>
                </div>

                <label for="event-time" class="block text-xs font-bold uppercase text-muted mb-1">Time</label>
                <input type="text" id="event-time" maxlength="40" placeholder="5:00 PM" class="w-full border border-gray-300 p-3 rounded-xl mb-3 outline-none text-sm">

                <label for="event-location" class="block text-xs font-bold uppercase text-muted mb-1">Location / Venue (e.g., Tamil Nadu, Kerala)</label>
                <input type="text" id="event-location" maxlength="120" placeholder="e.g., Chennai, Tamil Nadu" class="w-full border border-gray-300 p-3 rounded-xl mb-3 outline-none text-sm">

                <label for="event-image" class="block text-xs font-bold uppercase text-muted mb-1">Photo Image URL (Optional)</label>
                <input type="url" id="event-image" maxlength="2000" placeholder="https://..." class="w-full border border-gray-300 p-3 rounded-xl mb-3 outline-none text-sm">

                <label for="event-link" class="block text-xs font-bold uppercase text-muted mb-1">Registration Link (Optional)</label>
                <input type="url" id="event-link" maxlength="2000" placeholder="https://..." class="w-full border border-gray-300 p-3 rounded-xl mb-6 outline-none text-sm">

                <div class="flex space-x-3">
                    <button type="button" onclick="closePostModal()" class="btn-secondary flex-1 bg-gray-100 text-gray-700 font-bold py-3 rounded-xl hover:bg-gray-200 text-sm">Cancel</button>
                    <button type="button" onclick="submitRealEvent()" id="submit-btn" class="flex-1 bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700 text-sm">Publish Event</button>
                </div>
            </div>
        </div>

        <!-- HEADER -->
        <header class="bg-white card-bg border-b border-gray-200 p-4 sticky top-0 z-40 flex justify-between items-center transition-colors">
            <h1 class="text-xl font-black tracking-tight">SportsX</h1>
            <div class="flex items-center space-x-2">
                <button type="button" onclick="toggleDarkMode()" aria-label="Toggle dark mode" class="btn-secondary w-9 h-9 rounded-xl bg-gray-100 text-gray-600 flex items-center justify-center text-sm shadow-sm transition">
                    <i id="theme-icon" class="fa-solid fa-moon text-gray-600" aria-hidden="true"></i>
                </button>
                <button type="button" onclick="openPostModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded-xl font-bold text-xs shadow-md transition flex items-center space-x-1">
                    <i class="fa-solid fa-plus" aria-hidden="true"></i>
                    <span>Post</span>
                </button>
            </div>
        </header>

        <!-- CONTENT TABS -->
        <main class="flex-1 overflow-y-auto hide-scrollbar pb-safe w-full p-4 flex flex-col items-center transition-colors">

            <!-- FEED TAB -->
            <div id="tab-feed" class="w-full flex flex-col items-center">
                <div class="w-full mb-4 relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-gray-400 text-xs" aria-hidden="true"></i>
                    <input type="search" id="search-input" oninput="filterEvents()" aria-label="Search events" placeholder="Search by location (e.g. Tamil Nadu, Kerala) or sport..." class="w-full bg-white card-bg border border-gray-200 pl-10 pr-4 py-2.5 rounded-xl text-xs outline-none shadow-sm">
                </div>

                <p id="user-welcome" class="text-center text-muted text-xs mb-4 font-bold uppercase tracking-wider">Loading...</p>
                <div id="events-feed" class="w-full space-y-4"></div>
            </div>

            <!-- ACCOUNT CENTRE TAB -->
            <div id="tab-account" class="w-full hidden space-y-4">
                <div class="bg-white card-bg p-6 rounded-2xl shadow-sm border border-gray-100 text-center">
                    <div class="w-20 h-20 bg-gradient-to-tr from-blue-600 to-teal-400 text-white rounded-full flex items-center justify-center text-3xl font-black mx-auto mb-3 shadow-md overflow-hidden" id="profile-avatar-container">
                        <span id="profile-initial">U</span>
                    </div>
                    <h2 id="profile-name" class="text-xl font-black mb-1">User Name</h2>
                    <p id="profile-email" class="text-xs text-muted mb-4">user@gmail.com</p>

                    <div class="subtle-bg p-4 rounded-xl mb-4 text-left space-y-3">
                        <label for="profile-pic-input" class="block text-xs font-bold uppercase text-muted">Change Profile Picture URL</label>
                        <div class="flex space-x-2">
                            <input type="url" id="profile-pic-input" maxlength="2000" placeholder="https://... image link" class="w-full border border-gray-300 p-2.5 rounded-xl text-xs outline-none">
                            <button type="button" onclick="updateProfilePic()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-3 py-2.5 rounded-xl text-xs">Update</button>
                        </div>
                    </div>

                    <div class="divider border-t pt-4 text-left space-y-3 mb-6">
                        <h3 class="text-xs font-bold uppercase text-muted tracking-wider">Account Centre Settings</h3>
                        <div class="subtle-bg p-3 rounded-xl flex items-center justify-between text-xs font-semibold">
                            <span>Authentication Status</span>
                            <span class="status-ok text-green-600"><i class="fa-solid fa-circle-check mr-1" aria-hidden="true"></i>Google Verified</span>
                        </div>
                    </div>

                    <button type="button" onclick="logout()" class="btn-danger w-full bg-red-50 text-red-600 font-bold py-3 rounded-xl text-xs hover:bg-red-100 transition">
                        <i class="fa-solid fa-right-from-bracket mr-1.5" aria-hidden="true"></i> Log Out
                    </button>
                </div>
            </div>

        </main>

        <!-- BOTTOM NAVIGATION -->
        <nav class="nav-bar bg-white card-bg border-t border-gray-200 absolute bottom-0 inset-x-0 z-40 flex justify-around items-center px-2">
            <button type="button" onclick="switchTab('feed')" id="nav-feed" class="flex-1 flex flex-col items-center justify-center text-blue-600 font-bold transition">
                <i class="fa-solid fa-house text-lg mb-0.5" aria-hidden="true"></i>
                <span class="text-2xs">Feed</span>
            </button>
            <button type="button" onclick="switchTab('account')" id="nav-account" class="flex-1 flex flex-col items-center justify-center text-gray-400 hover:text-gray-600 font-bold transition">
                <i class="fa-solid fa-user-gear text-lg mb-0.5" aria-hidden="true"></i>
                <span class="text-2xs">Account Centre</span>
            </button>
        </nav>
    </div>

    <!-- SCRIPT HELPERS -->
    <script>
        let allEventsCache = [];

        /* Escape untrusted text before putting it into innerHTML */
        function esc(value) {
            return String(value == null ? '' : value).replace(/[&<>"']/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }

        /* Returns a normalised http(s) URL, or '' if the value is not a safe web link */
        function safeUrl(value) {
            try {
                var u = new URL(String(value == null ? '' : value).trim());
                return (u.protocol === 'http:' || u.protocol === 'https:') ? u.href : '';
            } catch (e) {
                return '';
            }
        }

        /* "2026-09-19" -> "19 Sept 2026" (parsed manually to avoid timezone shifts) */
        function formatDate(iso) {
            var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
            if (!m) return iso || '';
            var d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
            return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
        }

        function toggleDarkMode() {
            var isDark = document.documentElement.classList.toggle('dark');
            applyThemeIcon();
            try { localStorage.setItem('sportsx-theme', isDark ? 'dark' : 'light'); } catch (e) { /* ignore */ }
        }

        function applyThemeIcon() {
            var icon = document.getElementById('theme-icon');
            icon.className = document.documentElement.classList.contains('dark')
                ? 'fa-solid fa-sun text-yellow-400'
                : 'fa-solid fa-moon text-gray-600';
        }
        applyThemeIcon();

        window.switchTab = function (tabName) {
            var NAV_BASE = 'flex-1 flex flex-col items-center justify-center font-bold transition ';
            var showFeed = tabName === 'feed';
            document.getElementById('tab-feed').classList.toggle('hidden', !showFeed);
            document.getElementById('tab-account').classList.toggle('hidden', showFeed);
            document.getElementById('nav-feed').className = NAV_BASE + (showFeed ? 'text-blue-600' : 'text-gray-400 hover:text-gray-600');
            document.getElementById('nav-account').className = NAV_BASE + (showFeed ? 'text-gray-400 hover:text-gray-600' : 'text-blue-600');
            var main = document.querySelector('main');
            if (main) main.scrollTop = 0;
        };

        function renderEventCard(ev) {
            var img = safeUrl(ev.image);
            var link = safeUrl(ev.link);

            var imageHTML = img
                ? '<div class="mb-3 -mx-4 -mt-4 overflow-hidden rounded-t-2xl h-40 bg-gray-200">' +
                  '<img src="' + esc(img) + '" loading="lazy" class="w-full h-full object-cover" alt="Event poster" onerror="this.parentElement.remove()"></div>'
                : '';

            var dateDisplay = (ev.endDate && ev.endDate !== ev.date)
                ? formatDate(ev.date) + ' to ' + formatDate(ev.endDate)
                : formatDate(ev.date);

            var linkHTML = link
                ? '<a href="' + esc(link) + '" target="_blank" rel="noopener noreferrer" class="w-full bg-blue-600 text-white font-bold py-2.5 px-4 rounded-xl text-xs flex items-center justify-center space-x-2 shadow hover:bg-blue-700 transition">' +
                  '<span>Register / Event Link</span>' +
                  '<i class="fa-solid fa-arrow-up-right-from-square text-2xs" aria-hidden="true"></i></a>'
                : '';

            return '' +
                '<div class="event-card bg-white card-bg p-4 rounded-2xl shadow-sm border border-gray-100 overflow-hidden">' +
                    imageHTML +
                    '<div class="flex justify-between items-start mb-2 space-x-2">' +
                        '<span class="badge-sport bg-blue-100 text-blue-700 text-xs font-extrabold px-3 py-1 rounded-full uppercase tracking-wider">' + esc(ev.sport) + '</span>' +
                        '<span class="badge-org text-xs bg-gray-100 text-muted
